# ============================================================
# WRO 2026 Future Engineers – System Prompt Matrix
# Team Obsidian
# ============================================================
# All calibratable parameters are stored here.
# Changes take effect on next restart (no code recompile needed).

system_prompt_matrix:
  version: "2026.3"
  competition: "WRO Future Engineers"

  # ==========================================================
  # ZONE MANAGEMENT (Open / Obstacle Challenge)
  # ==========================================================
  zone_management:
    open_challenge:
      save_start_point: true
      use_parking_slot: false
      start_pose_registration:
        method: "origin"
      finish_behavior:
        stop: true
    obstacle_challenge:
      save_start_point: true
      use_parking_slot: true
      start_pose_registration:
        method: "origin"
      finish_behavior:
        park: true

  # ==========================================================
  # SENSOR FUSION & TRACKING
  # ==========================================================
  sensor_fusion_and_tracking:
    huskylens_camera:
      i2c_bus: 1
      poll_interval: 0.05
    lidar_2d:
      port: "/dev/ttyUSB1"
      baudrate: 460800
    host_spatial_tracker:
      spatial_gating_threshold: 0.20
      confirmation_frames: 2
      persistence_timeout_s: 1.5
      velocity_compensated_pruning: true

  # ==========================================================
  # ULTRASONIC EMERGENCY SHIELD
  # ==========================================================
  ultrasonic_emergency_shield:
    enabled: true
    enable_reverse: true
    enable_rear_check: true
    enable_hard_shield: true
    enable_hard_steer: true
    thresholds_cm:
      front_stop: 12.0
      front_left_safety: 18.0
      front_right_safety: 18.0
      critical_stop: 8.0
      hard_shield_cm: 5.0
    dynamic_throttle:
      enable_speed_dampening: true
      dampened_speed_factor: 0.60
    reverse_params:
      speed_mps: -0.10
      duration_s: 1.0
      rear_clearance_threshold_m: 0.15

  # ==========================================================
  # TRAFFIC LIGHT PASSING RULES
  # ==========================================================
  traffic_light_passing_rules:
    RED_BLOCK_PASS_SIDE: "LEFT"
    GREEN_BLOCK_PASS_SIDE: "RIGHT"
    INVERT_COLORS_MID_RACE: false

  # ==========================================================
  # NAVIGATION MATRIX
  # ==========================================================
  navigation_matrix:
    TOTAL_REQUIRED_LAPS: 3
    LAP_1_DIRECTION: "CLOCKWISE"
    LAP_2_DIRECTION: "COUNTER_CLOCKWISE"
    LAP_3_DIRECTION: "CLOCKWISE"

  # ==========================================================
  # STATE MACHINE
  # ==========================================================
  state_machine:
    STATE_1_INIT:
      - "register_start_pose"
      - "reset_counters"
    STATE_2_NAVIGATE:
      - "wall_follow"
      - "corner_detection"
      - "traffic_light_handling"
    STATE_3_TERMINATION:
      - "stop"   # for open challenge
      - "park"   # for obstacle challenge

  # ==========================================================
  # MAPPING
  # ==========================================================
  mapping:
    use_mapping: true
    save_map_to_disk: true
    load_map_from_disk: true
    force_rebuild: false

  # ==========================================================
  # SURPRISE RULE
  # ==========================================================
  surprise_rule:
    enabled: true
    trigger_lap: 2
    color_to_continue: "GREEN"
    color_to_reverse: "RED"
    fallback_direction: "REVERSE"
    turnaround_speed: 0.1

  # ==========================================================
  # LAP COUNTING
  # ==========================================================
  lap_counting:
    lap_length_m: 12.0
    section_fallback_timeout_s: 3.0
    emergency_lap_margin_m: 0.2

  # ==========================================================
  # VEHICLE PARAMETERS
  # ==========================================================
  vehicle:
    wheelbase_m: 0.25
    max_speed_mps: 1.8
    max_steer_rad: 0.524   # 30°

  # ==========================================================
  # VISION (HuskyLens colour IDs)
  # ==========================================================
  vision:
    color_red_id: 1
    color_green_id: 2

  # ==========================================================
  # NAVIGATION BEHAVIOR (Open & Obstacle Challenges)
  # ==========================================================
  navigation:
    # ---- Direction mode ----
    direction_mode: "auto"        # "switch" = read DIRECTION_SELECT GPIO (manual)
                                  # "auto"   = infer from LIDAR asymmetry at startup
    auto_direction_scan_window_deg: 60
    auto_direction_min_confidence_m: 0.15

    # ---- Speed control (look‑ahead braking, feedforward) ----
    cruise_speed_mps: 1.7                 # target speed on straights
    max_accel_mps2: 2.5                   # maximum acceleration (m/s²)
    max_decel_mps2: 3.5                   # maximum deceleration for braking (m/s²)
    enable_lookahead_braking: true        # toggle look‑ahead corner braking
    corner_strength_ref: 0.35             # reference corner strength for scaling

    # ===== Open Challenge =====
    open_challenge:
      base_speed_mps: 1.7
      wall_follow_gain: 0.30
      steer_magnitude_radps: 0.35
      straight_boost_factor: 1.20
      corner_slowdown_max_reduction: 0.3
      predictive_slowdown_gain: 0.3
      pid:
        kp: 2.2          # normalised error: ~10x larger than previous raw-error scale
        ki: 0.02
        kd: 0.9
      corner_detection:
        use_derivative: true
        use_percentage: true
        use_graded_steering: true
        use_imu_confirmation: true
        lidar_derivative_threshold: 0.3
        pct_threshold: 0.4
        imu_confirm_threshold_radps: 0.3
      g_force:
        max_safe_g: 0.30
        filter_alpha: 0.3

    # ===== Obstacle Challenge =====
    obstacle_challenge:
      base_speed_mps: 1.5
      wall_follow_gain: 0.25
      steer_magnitude_radps: 0.30
      straight_boost_factor: 1.10
      corner_slowdown_max_reduction: 0.4
      predictive_slowdown_gain: 0.4
      pid:
        kp: 2.2          # normalised error: ~10x larger than previous raw-error scale
        ki: 0.02
        kd: 0.9
      corner_detection:
        use_derivative: true
        use_percentage: true
        use_graded_steering: true
        use_imu_confirmation: true
        lidar_derivative_threshold: 0.3
        pct_threshold: 0.4
        imu_confirm_threshold_radps: 0.3
      g_force:
        max_safe_g: 0.30
        filter_alpha: 0.3
      traffic_light:
        distance_slowdown_start_m: 2.0
        distance_slowdown_min_factor: 0.4
        steering_slowdown_max_reduction: 0.4
        lidar_confirm_range_m: 2.5

  # ==========================================================
  # PARKING CONFIGURATION
  # ==========================================================
  parking:
    emergency_shield:
      enabled: true
      use_parking_thresholds: true
      thresholds_cm:
        front_stop: 20.0
        front_left_safety: 25.0
        front_right_safety: 25.0
        critical_stop: 15.0
        hard_shield_cm: 8.0
      dynamic_throttle:
        enable_speed_dampening: true
        dampened_speed_factor: 0.4
      disable_reverse: false
      disable_hard_steer: false
      disable_hard_shield: false
