system_prompt_matrix:
  version: "2026.3"
  competition: "WRO Future Engineers"

  # ==========================================
  # 0. CHALLENGE SELECTION
  # ==========================================
  # This is optional – if set, it overrides the hardware switch (GPIO 22).
  # Leave commented to use the hardware switch.
  # active_challenge: "open"   # "open" or "obstacle"

  # ==========================================
  # 1. ZONE & POSE MANAGEMENT
  # ==========================================
  zone_management:
    open_challenge:
      save_start_point: True
      use_parking_slot: False
      start_pose_registration:
        method: "LIDAR_WALL_DISTANCES_AND_ODOMETRY"
        save_at_boot: True
        pose_vector: [x_start, y_start, theta_start]
      finish_behavior:
        action: "CONTROLLED_STOP_AT_START_ZONE"
        trigger: "COMPLETED_3_LAPS_AND_CROSS_START_LINE"
        deceleration_profile: "SMOOTH_BRAKE"

    obstacle_challenge:
      save_start_point: True
      use_parking_slot: True
      parking_slot_registration:
        save_initial_bay_geometry: True
        save_at_boot: True
        bay_bounding_box: [x_min, x_max, y_min, y_max]
      finish_behavior:
        action: "PARALLEL_PARKING_SEQUENCE"
        trigger: "COMPLETED_3_LAPS_AND_ENTERED_PARKING_ZONE"
        parking_routine:
          1_APPROACH: "Align parallel to saved parking bay side wall using Lidar."
          2_REVERSE_STEER: "Execute inverse Ackerman turn into the bay."
          3_ALIGN_AND_CENTER: "Adjust distance using side and rear Lidar points."
          4_FULL_STOP: "Engage motor brake and zero velocity."

  # ==========================================
  # 2. SENSOR FUSION & HOST-SIDE TRACKING
  # ==========================================
  sensor_fusion_and_tracking:
    huskylens_camera:
      role: "RAW_BOUNDING_BOX_DETECTOR"
      outputs: ["COLOR_ID", "CENTROID_X", "CENTROID_Y", "WIDTH", "HEIGHT"]
      horizontal_fov_deg: 60.0

    lidar_2d:
      scan_arc_deg: 90.0
      update_rate_hz: 10

    host_spatial_tracker:
      processor_location: "MAIN_ONBOARD_COMPUTER"
      coordinate_transformation:
        method: "FUSE_CAMERA_ANGLE_WITH_LIDAR_DISTANCE"
        formula: |
          Theta_rel = Camera_Centroid_To_Angle(x_px)
          R_rel = Lidar_Range_At_Angle(Theta_rel)
          Local_Coord = (R_rel * cos(Theta_rel), R_rel * sin(Theta_rel))

      spatial_gating:
        tolerance_radius_m: 0.20

      debouncing_and_persistence:
        confirmation_threshold_frames: 3
        frame_loss_tolerance_sec: 1.5
        prune_condition: "Y_LOCAL < 0.0"

      passing_priority_queue:
        sorting_rule: "SORT_BY_ASCENDING_FORWARD_DISTANCE"
        active_target: "QUEUE_INDEX_0"

  # ==========================================
  # 3. EMERGENCY ULTRASONIC BUMPER SHIELD
  # ==========================================
  ultrasonic_emergency_shield:
    enabled: True
    thresholds_cm:
      front_stop: 12.0                  # Start reducing speed
      front_left_safety: 18.0           # Steer right if left side close
      front_right_safety: 18.0          # Steer left if right side close
      critical_stop: 8.0                # Reverse if closer than this
    dynamic_throttle:
      enable_speed_dampening: True
      dampened_speed_factor: 0.60

  # ==========================================
  # 4. SURPRISE TASK & DYNAMIC RULES
  # ==========================================
  traffic_light_passing_rules:
    RED_BLOCK_PASS_SIDE: "RIGHT"
    GREEN_BLOCK_PASS_SIDE: "LEFT"
    INVERT_COLORS_MID_RACE: False

  # ==========================================
  # 5. NAVIGATION & LAP COUNTING (BASE)
  # ==========================================
  navigation_matrix:
    TOTAL_REQUIRED_LAPS: 3
    LAP_1_DIRECTION: "CLOCKWISE"
    LAP_2_DIRECTION: "CLOCKWISE"
    LAP_3_DIRECTION: "CLOCKWISE"

  # ==========================================
  # 6. PARKING CONFIGURATION (LIDAR-based)
  # ==========================================
  # These values are used by parking_controller.py.
  # They are hardcoded in the code, but you can override them here.
  parking:
    rear_wall_target_m: 0.05           # 5 cm from rear wall
    side_wall_target_m: 0.10           # 10 cm from side wall
    alignment_tolerance_m: 0.02        # 2 cm tolerance
    approach_speed_mps: 0.10           # Speed during approach
    reverse_speed_mps: -0.12           # Speed during reverse

  # ==========================================
  # 7. STATE MACHINE EXECUTION (DESCRIPTIVE)
  # ==========================================
  state_machine:
    STATE_1_INIT:
      - Register starting pose $(X_0, Y_0, \theta_0)$ via Lidar.
      - If Challenge == "OBSTACLE": Register parking slot dimensions.
      - Reset lap counter to 0.

    STATE_2_NAVIGATE:
      - Run Host Spatial Tracker (HuskyLens raw bounding box + Lidar fusion).
      - Check Ultrasonic Emergency Shield:
          - If Distance < `front_stop`: Reduce speed and steer according to traffic rule.
          - If Distance < `critical_stop`: Reverse briefly then continue.
          - If Distance < `front_left_safety` / `front_right_safety`: Steer away.
      - Maintain persistent map and filter out vision drops/flickers.
      - Steer vehicle relative to `active_target` (`RED` -> Right, `GREEN` -> Left).
      - Track lap completion via LIDAR corner detection + odometry fallback.

    STATE_3_TERMINATION:
      - If Challenge == "OPEN" and Laps == 3:
          - Target saved `start_pose` and perform smooth deceleration to full stop.
      - If Challenge == "OBSTACLE" and Laps == 3:
          - Navigate to saved `parking_slot_geometry` and trigger 4-stage Parallel Parking sequence using LIDAR 360°.

  # ==========================================
  # 8. MAPPING CONFIGURATION
  # ==========================================
  mapping:
    use_mapping: True                 # Enable/disable mapping entirely
    save_map_to_disk: True            # Save map after each round (non‑volatile)
    load_map_from_disk: True          # Load existing map at startup
    force_rebuild: False              # If True, delete existing map and rebuild fresh

  # ==========================================
  # 9. SURPRISE RULE (LAP X → LAP X+1)
  # ==========================================
  surprise_rule:
    enabled: True                     # Enable/disable the rule
    trigger_lap: 2                    # Which lap triggers the rule (default 2)
    color_to_continue: "GREEN"        # If last traffic light = this, continue same direction
    color_to_reverse: "RED"           # If last traffic light = this, reverse direction
    fallback_direction: "REVERSE"     # If no traffic light detected → "REVERSE" or "SAME"
    turnaround_speed: 0.1             # Speed during 180° turn (m/s)

  # ==========================================
  # 10. LAP COUNTING & ODOMETRY FALLBACK
  # ==========================================
  lap_counting:
    lap_length_m: 12.0                # Full lap distance (calibrate to your track)
    section_fallback_timeout_s: 3.0   # Time without corner detection before using odometry section fallback
    emergency_lap_margin_m: 0.2       # Margin below full lap to trigger emergency lap completion

  # ==========================================
  # 11. VEHICLE PHYSICAL PARAMETERS
  # ==========================================
  vehicle:
    wheelbase_m: 0.25                 # Distance between front and rear axles (meters)
    max_speed_mps: 0.5                # Maximum forward speed (m/s)
    max_steer_rad: 0.524              # Maximum steering angle (radians) ~30°

  # ==========================================
  # 12. NAVIGATION & BEHAVIOR
  # ==========================================
  navigation:
    base_speed_mps: 0.3               # Cruise speed during navigation
    steer_magnitude_radps: 0.3        # Yaw rate when turning for traffic lights
    wall_follow_gain: 0.25            # Proportional gain for wall‑following

  # ==========================================
  # 13. VISION (HUSKYLENS)
  # ==========================================
  vision:
    color_red_id: 1                   # Learned ID for RED on HuskyLens
    color_green_id: 2                 # Learned ID for GREEN on HuskyLens
